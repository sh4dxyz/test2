<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio | Ambilight Flux</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Syncopate:wght@400;700&display=swap');

        :root {
            --bg-base: #ffffff; /* Blanc pur pour meilleure projection */
            --text-dark: #121212;
            --shadow-color: rgba(0,0,0,0.06);
        }

        body, html {
            margin: 0; padding: 0;
            width: 100%; height: 100%;
            background: var(--bg-base);
            color: var(--text-dark);
            font-family: 'Syncopate', sans-serif;
            overflow: hidden;
            touch-action: none;
            transition: background-color 0.8s ease; /* Transition douce pour Ambilight */
        }

        /* --- FOND : EFFET AMBILIGHT DISCRET --- */
        #ambilight-glow {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 120vw;
            height: 120vh;
            z-index: -1;
            filter: blur(150px); /* Flou très large pour diffusion */
            opacity: 0.15; /* Très furtif et esthétique */
            background: radial-gradient(circle, rgba(255,255,255,0) 0%, rgba(255,255,255,0) 100%);
            transition: background 1s ease; /* Transition des couleurs */
        }

        main {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 60px;
            position: relative;
            z-index: 2;
        }

        /* --- TITRE OUTLINE --- */
        .brand-title {
            font-size: clamp(1rem, 3vw, 1.8rem);
            letter-spacing: 12px;
            font-weight: 700;
            text-transform: uppercase;
            user-select: none;
            color: transparent;
            -webkit-text-stroke: 1px var(--text-dark);
            opacity: 0.8;
        }

        .divider {
            width: 1px; height: 100px;
            background: var(--text-dark); opacity: 0.1;
        }

        /* --- ZONE DE SCROLL --- */
        .scroll-viewport {
            width: 440px;
            height: 65vh;
            position: relative;
            overflow: hidden;
            cursor: grab;
            mask-image: linear-gradient(to bottom, transparent, black 15%, black 85%, transparent);
            -webkit-mask-image: linear-gradient(to bottom, transparent, black 15%, black 85%, transparent);
        }

        .scroll-viewport:active { cursor: grabbing; }

        #video-container {
            display: flex;
            flex-direction: column;
            gap: 50px;
            padding: 150px 0; /* Plus de marge pour le centre */
            will-change: transform;
        }

        .video-item {
            width: 100%;
            aspect-ratio: 16/9;
            background: #000;
            /* Pas de grayscale ici pour que Ambilight capte les couleurs */
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            box-shadow: 0 10px 30px var(--shadow-color);
            border-radius: 2px;
            overflow: hidden;
            border: 1px solid rgba(0,0,0,0.03);
            position: relative;
        }

        .video-item:hover { 
            transform: scale(1.02);
            box-shadow: 0 20px 50px rgba(0,0,0,0.1);
        }

        .video-item iframe { width: 100%; height: 100%; pointer-events: none; border: none; }

        /* --- FOOTER LINKEDIN --- */
        footer {
            position: fixed;
            bottom: 30px;
            width: 100%;
            text-align: center;
            z-index: 5;
        }

        .linkedin-link {
            font-size: 10px;
            letter-spacing: 4px;
            text-decoration: none;
            color: var(--text-dark);
            opacity: 0.3;
            transition: opacity 0.3s ease;
            text-transform: uppercase;
        }

        .linkedin-link:hover { opacity: 0.9; }

        /* --- CINEMA --- */
        #cinema-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255, 255, 255, 0.98);
            z-index: 10000; display: none; justify-content: center; align-items: center;
        }
        #cinema-container { width: 85%; max-width: 1100px; aspect-ratio: 16/9; position: relative; box-shadow: 0 40px 100px rgba(0,0,0,0.1); }
        #close-cinema { position: absolute; top: -35px; right: 0; color: var(--text-dark); cursor: pointer; font-size: 10px; letter-spacing: 2px; font-weight: 700; }

        @media (max-width: 900px) {
            main { flex-direction: column; gap: 30px; }
            .scroll-viewport { width: 92%; height: 55vh; }
        }
    </style>
</head>
<body>

    <div id="ambilight-glow"></div>

    <div id="cinema-overlay">
        <div id="cinema-container">
            <span id="close-cinema" onclick="closeCinema()">✕ EXIT_VIEWER</span>
            <iframe id="cinema-iframe" width="100%" height="100%" src="" allowfullscreen></iframe>
        </div>
    </div>

    <main>
        <div class="brand-title">PORTFOLIO</div>
        <div class="divider"></div>
        <div class="scroll-viewport" id="scroll-zone">
            <div id="video-container">
                <div class="video-item" data-color="rgba(100, 150, 255, 1)" onclick="openCinema('JVr6fLRFF6E')">
                    <iframe src="https://www.youtube.com/embed/JVr6fLRFF6E?controls=0&mute=1&loop=1&playlist=JVr6fLRFF6E"></iframe>
                </div>
                <div class="video-item" data-color="rgba(255, 100, 100, 1)" onclick="openCinema('9B5XMo0LKks')">
                    <iframe src="https://www.youtube.com/embed/9B5XMo0LKks?controls=0&mute=1&loop=1&playlist=9B5XMo0LKks"></iframe>
                </div>
                <div class="video-item" data-color="rgba(120, 255, 120, 1)" onclick="openCinema('ExgJBk3AgXk')">
                    <iframe src="https://www.youtube.com/embed/ExgJBk3AgXk?controls=0&mute=1&loop=1&playlist=ExgJBk3AgXk"></iframe>
                </div>
                <div class="video-item" data-color="rgba(255, 200, 100, 1)" onclick="openCinema('uw9A8QfMdIw')">
                    <iframe src="https://www.youtube.com/embed/uw9A8QfMdIw?controls=0&mute=1&loop=1&playlist=uw9A8QfMdIw"></iframe>
                </div>
            </div>
        </div>
    </main>

    <footer>
        <a href="https://www.linkedin.com/in/shady-beckoury-0b7385270/" target="_blank" class="linkedin-link">Linkedin</a>
    </footer>

    <script>
        // --- AMBILIGHT & SCROLL LOGIC ---
        const zone = document.getElementById('scroll-zone');
        const container = document.getElementById('video-container');
        const glow = document.getElementById('ambilight-glow');
        const items = document.querySelectorAll('.video-item');
        
        let scrollY = 0, targetY = 0, isDragging = false, startY = 0;

        const getMaxScroll = () => container.offsetHeight - zone.offsetHeight;

        window.addEventListener('wheel', (e) => {
            targetY -= e.deltaY * 0.5;
            clampScroll();
        });

        zone.addEventListener('mousedown', (e) => { isDragging = true; startY = e.pageY - targetY; });
        window.addEventListener('mousemove', (e) => {
            if (!isDragging) return;
            targetY = e.pageY - startY;
            clampScroll();
        });
        window.addEventListener('mouseup', () => isDragging = false);

        zone.addEventListener('touchstart', (e) => { isDragging = true; startY = e.touches[0].pageY - targetY; });
        window.addEventListener('touchmove', (e) => {
            if (!isDragging) return;
            targetY = e.touches[0].pageY - startY;
            clampScroll();
        });
        window.addEventListener('touchend', () => isDragging = false);

        function clampScroll() {
            const max = getMaxScroll();
            if (targetY > 0) targetY = 0;
            if (targetY < -max) targetY = -max;
        }

        // Fonction pour détecter la vidéo la plus centrale et mettre à jour Ambilight
        function updateAmbilight() {
            const zoneRect = zone.getBoundingClientRect();
            const zoneCenter = zoneRect.top + zoneRect.height / 2;
            
            let closestItem = null;
            let minDistance = Infinity;

            items.forEach(item => {
                const itemRect = item.getBoundingClientRect();
                const itemCenter = itemRect.top + itemRect.height / 2;
                const distance = Math.abs(zoneCenter - itemCenter);

                if (distance < minDistance) {
                    minDistance = distance;
                    closestItem = item;
                }
            });

            if (closestItem) {
                const color = closestItem.getAttribute('data-color');
                // Mise à jour du halo radial avec la couleur de la vidéo centrale
                glow.style.background = `radial-gradient(circle, ${color.replace('1)', '0.6)')} 0%, rgba(255,255,255,0) 70%)`;
            }
        }

        function update() {
            const diff = targetY - scrollY;
            scrollY += diff * 0.08; 
            container.style.transform = `translateY(${scrollY}px)`;
            
            // Mise à jour de l'Ambilight à chaque frame du scroll
            updateAmbilight();
            
            requestAnimationFrame(update);
        }
        update();

        // --- CINEMA ---
        function openCinema(id) {
            document.getElementById('cinema-iframe').src = `https://www.youtube.com/embed/${id}?autoplay=1`;
            document.getElementById('cinema-overlay').style.display = 'flex';
        }
        function closeCinema() {
            document.getElementById('cinema-overlay').style.display = 'none';
            document.getElementById('cinema-iframe').src = '';
        }
    </script>
</body>
</html>
